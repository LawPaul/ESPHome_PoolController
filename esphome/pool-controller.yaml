# Pool Controller — Waveshare ESP32-S3-ETH-8DI-8RO
# Relays are driven through the onboard TCA9554 I2C expander (NOT direct GPIO).
# Pentair IntelliFlo3 pump + IntelliChlor (via PC100) over the onboard isolated RS485,
# using the firmware-derived `pentair` external component (IntelliCenter/OCP replacement).
# See wiring.md for the terminal/relay mapping this config mirrors.

substitutions:
  # --- I2C (RTC + relay expander) ---
  i2c_sda_pin: GPIO42
  i2c_scl_pin: GPIO41
  # --- DS18B20 outdoor temp probe (wiring.md §6) ---
  one_wire_pin: GPIO21
  # --- Onboard isolated RS485 to the Pentair bus ---
  pentair_tx_pin: GPIO17
  pentair_rx_pin: GPIO18
  # --- Status peripherals ---
  rgb_pin: GPIO38
  buzzer_pin: GPIO46
  # --- Home Assistant entities that Pool Math feeds (set to yours) ---
  # These MUST match the real HA entity ids exactly. A wrong id fails SILENTLY:
  # the imported sensor just stays NaN, FC Target reads "NA", and the chlorine
  # auto-tune discards every reading (SkipMissingData) without complaining.
  # Corrected 2026-07-26 -- they were the sensor.pool_* defaults, which never
  # existed here, so the trim sat at its 50% cold-start seed indefinitely.
  poolmath_fc_entity: sensor.backyard_fc
  poolmath_cya_entity: sensor.backyard_cya
  # --- Plant constants for the chlorine mass balance ---
  # Output % sets a RATE, not a level, so these two numbers are what convert
  # "the cell ran N equivalent full-output hours" into ppm actually delivered:
  # 1 lb of chlorine in 10,000 gal is ~12 ppm. Used only by the Chlorine Demand
  # observer, which currently drives nothing.
  pool_gallons: "27000"
  cell_lb_per_day: "2.0"
  # Hours a day the cell can generate. The pump runs 24/7 here; drop this if it
  # is ever put on a schedule, or "Suggested Chlorine Output" reads low.
  cell_generating_hours: "24"


esphome:
  name: pool-controller
  friendly_name: Pool Controller
  min_version: 2025.9.0
  on_boot:
    # Enter the base mode (default = Auto, value 0: idle-pool hydraulics +
    # scheduled cleaning) once at startup so the pump is circulating 24/7 for the
    # IntelliChlor. base_mode 0 == Auto, so both fresh and previously-persisted devices
    # come up in Auto unless another mode was explicitly saved. Late priority +
    # a short delay let the relay expander and pump RS485 come up first.
    priority: -100
    then:
      - delay: 15s
      - script.execute: apply_base_mode


esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf


logger:
  logs:
    pentair: WARN
  # Latch the first WiFi warning of each outage into a diagnostic entity. The
  # disconnect reason code is only ever emitted as a log line, so without this
  # a drop that is discovered hours later is unattributable. Tag is matched by
  # PREFIX: the reason string is logged by wifi_component_esp_idf.cpp, whose tag
  # is "wifi_esp32", while the rest of the component logs as "wifi".
  # Safe from recursion: this fires at WARN and above, state publishes log at DEBUG.
  on_message:
    level: WARN
    then:
      - lambda: |-
          if (tag == nullptr || strncmp(tag, "wifi", 4) != 0) return;
          id(wifi_drop_count) += 1;
          if (id(wifi_drop_latched)) return;
          id(wifi_drop_latched) = true;
          char stamp[20] = "time-unknown";
          auto t = id(sntp_time).now();
          if (t.is_valid()) t.strftime(stamp, sizeof(stamp), "%m-%d %H:%M:%S");
          char buf[180];
          snprintf(buf, sizeof(buf), "#%d %s rssi=%.0f | %s",
                   id(wifi_drop_count), stamp, id(wifi_rssi).state, message);
          id(wifi_last_drop).publish_state(buf);

api:
  encryption:
    key: !secret api_key
  # 0 = never reboot on a lost HA connection. The API's own 15-min default is a
  # SECOND watchdog that fires long before wifi's reboot_timeout, so leaving it
  # would cycle the relays every 15 min during an HA/WiFi outage — exactly what
  # the long wifi timeout exists to prevent.
  reboot_timeout: 0s


ota:
  - platform: esphome
    password: !secret ota_password


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # DHCP, deliberately: a static IP was tried for the eero reconnect problem and
  # caused more trouble than it solved without fixing it.
  # Never let the radio sleep — modem sleep is a common cause of silent drops
  # and failed re-association on mesh APs, and the API needs a live link anyway.
  power_save_mode: none
  # NOTE: this value is INERT while an `ap:` block exists — wifi_component.cpp
  # guards it with `if (!this->has_ap() && ...)`. Kept only so the intent is
  # documented; the real self-heal is the wifi watchdog interval in logic.yaml.
  reboot_timeout: 24h
  # Clear the disconnect latch so the NEXT outage records its own first warning.
  on_connect:
    - lambda: 'id(wifi_drop_latched) = false;'
  # Fallback AP if WiFi fails (uses the external antenna you specced)
  ap:
    ssid: "Pool Controller Hotspot"
    password: !secret ap_password
    # Don't spin the hotspot up on the first hiccup (default 90s). Once the AP
    # is running ESPHome stops scanning so it doesn't disrupt the AP, leaving
    # only best-effort reconnects — so it's better to keep hammering the real
    # network for 15 min first. The eero's stale client entry usually ages out
    # inside that window, which avoids the manual router reboot entirely.
    ap_timeout: 15min


captive_portal:


web_server:
  port: 80
  version: 3


# Time sources: SNTP over the network is primary; the onboard battery-backed
# PCF85063 (0x51 on I2C) + ML1220 coin cell is a standalone backup. On every NTP
# sync we discipline the hardware RTC, and on boot the RTC seeds the system clock,
# so schedules (solar EMA roll, cleaning triggers) keep running through a power
# cycle even if WiFi/NTP are unavailable — e.g. away from home with the net down.
time:
  - platform: pcf85063
    id: rtc_time
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        - pcf85063.write_time:
    on_time:
      # Top of every hour: if it's a scheduled cleaning hour (AM or PM) and the
      # component allows it (freeze off, not in a fountains scene), kick off the
      # intelligent cleaning cycle.
      - seconds: 0
        minutes: 0
        then:
          - if:
              condition:
                lambda: |-
                  auto now = id(sntp_time).now();
                  if (!now.is_valid()) return false;
                  int h = now.hour;
                  return (h == (int) id(clean_hour_am).state
                          || h == (int) id(clean_hour_pm).state)
                         && id(pool_ctrl).may_clean();
              then:
                - script.execute: cleaning_cycle


# --- Pentair IntelliFlo + IntelliChlor + our chlorine controller ---
# `pentair` is the public firmware-derived IntelliCenter/OCP replacement and
# sole RS-485 bus master. The installation-specific controller remains local.
external_components:
  - source: github://LawPaul/ESPHome_PentairPool@v1.1.0
    components: [pentair]
  - source:
      type: local
      path: components
    components: [pool_control]


# =====================================================================
# I2C bus — TCA9554 relay expander (0x20) and PCF85063 RTC (0x51)
# =====================================================================
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true


pca9554:
  - id: relay_expander      # TCA9554 is pca9554-compatible
    address: 0x20


# =====================================================================
# UART + Pentair component (onboard isolated RS485, 9600 baud)
# =====================================================================
uart:
  - id: uart_bus
    tx_pin: ${pentair_tx_pin}
    rx_pin: ${pentair_rx_pin}
    baud_rate: 9600


# The hub is the sole bus master. `active_poll_interval` bounds how fast the
# flow-proven salt-cell interlock reacts to the pump starting/stopping (~2 s
# worst case); idle devices fall back to the slower `poll_interval`. The hub
# also owns the IntelliChlor flow gate (`require_pump_flow`, default true): it zeroes the
# chlorinator output command whenever the pump is not proving flow.
pentair:
  id: pentair_hub
  uart_id: uart_bus
  active_poll_interval: 2s
  pumps:
    - id: pentair_pump
      # IntelliFlo3 in flow (GPM) mode: VSF setpoint subcmd 0x09, matching the
      # single-byte GPM command the old component sent via commandFlow(). The
      # drive enforces a 20 GPM floor; lower-flow operation uses the controller's
      # RPM-mode feedback path instead of attempting a lower GPM command.
      pump_type: VSF
      mode: flow
      address: 0x60
  chlorinators:
    - id: pentair_chlor
      address: 0x50


# --- Chlorine auto-tune controller (external component) ---
# Owns the integral trim + solar feedforward + boost gating and persists its
# learned state across reboots. YAML just feeds it readings and lets it drive
# the chlorinator's output % number (chlorine_output) defined below.
pool_control:
  id: pool_ctrl
  output_number: chlorine_output

# =====================================================================
# The bulk of the device is split into packages to keep this top-level
# file navigable. ESPHome deep-merges them at build time; cross-file id
# references resolve after the merge, so this split is purely organisational.
#   numbers  — runtime-tunable config knobs (Home Assistant number entities)
#   entities — relays, sensors, binary/text sensors, the mode select, buttons
#   logic    — globals, intervals, and the actuation scripts
# =====================================================================
packages:
  numbers: !include includes/numbers.yaml
  entities: !include includes/entities.yaml
  logic: !include includes/logic.yaml


# =====================================================================
# DS18B20 outdoor temp probe (GPIO21, 4.7k pull-up to 3V3)
# =====================================================================
one_wire:
  - platform: gpio
    pin: ${one_wire_pin}


# =====================================================================
# Status LED + buzzer (optional niceties)
# =====================================================================
light:
  - platform: esp32_rmt_led_strip
    name: "Status LED"
    id: status_led
    internal: true
    pin: ${rgb_pin}
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812


output:
  - platform: ledc
    pin: ${buzzer_pin}
    id: buzzer_out


rtttl:
  output: buzzer_out
