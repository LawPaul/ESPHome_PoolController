views:
  - title: Home
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: sensor.pool_controller_pool_mode
                icon: >-
                  {% set m = states('sensor.pool_controller_pool_mode') %} {%
                  set icons = {
                    'Auto': 'mdi:autorenew', 'Pool': 'mdi:pool', 'Spa': 'mdi:hot-tub',
                    'Spillover': 'mdi:waterfall', 'Spa Bubbles': 'mdi:chart-bubble',
                    'Fountains Low': 'mdi:fountain', 'Fountains High': 'mdi:fountain',
                    'Cleaning': 'mdi:broom', 'Freeze Protect': 'mdi:snowflake',
                    'Service': 'mdi:account-wrench' } %}
                  {{ icons.get(m, 'mdi:state-machine') }}
                icon_color: >-
                  {% set problems = [
                    'binary_sensor.pool_controller_pump_alarm',
                    'binary_sensor.pool_controller_no_flow',
                    'binary_sensor.pool_controller_very_low_salt',
                    'binary_sensor.pool_controller_pump_comms_lost',
                    'binary_sensor.pool_controller_chlorinator_comms_lost'
                  ] %} {% set ns = namespace(bad=false) %} {% for e in problems
                  %}
                    {% if is_state(e, 'on') %}{% set ns.bad = true %}{% endif %}
                  {% endfor %} {% set colors = {
                    'Auto': 'green', 'Pool': 'blue', 'Spa': 'orange',
                    'Spillover': 'purple', 'Spa Bubbles': 'amber',
                    'Fountains Low': 'cyan', 'Fountains High': 'teal',
                    'Cleaning': 'indigo', 'Freeze Protect': 'light-blue',
                    'Service': 'red' } %} {{ 'red' if ns.bad else
                  colors.get(states('sensor.pool_controller_pool_mode'), 'grey')
                  }}
                content: '{{ states(''sensor.pool_controller_pool_mode'') }}'
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.backyard_ph
                icon: mdi:flask-outline
                icon_color: >-
                  {% set c = states('sensor.backyard_cya') | float(default=none)
                  %}

                  {% set c = [[c, 20] | max, 100] | min if c is not none else 60
                  %}

                  {% set fcmin = [2, (0.05 * c) | round(0, 'floor')] | max %}

                  {% set fclo = [3, (0.075 * c) | round(0, 'floor')] | max %}

                  {% set fchi = c / 10 + 3 %}

                  {% set checks = [
                    ('pH', 'sensor.backyard_ph', none, none, 0.2, 0.2),
                    ('FC', 'sensor.backyard_fc', fclo, fchi, fclo - fcmin, none),
                    ('CC', 'sensor.backyard_cc', none, none, 0, 0),
                    ('TA', 'sensor.backyard_ta', none, none, 10, 10),
                    ('CH', 'sensor.backyard_ch', none, none, 100, 100),
                    ('CYA', 'sensor.backyard_cya', 60, 90, 10, 10),
                    ('CSI', 'sensor.backyard_csi', none, none, 0.3, 0.3)
                  ] %}

                  {% set ns = namespace(worst=0) %}

                  {% for name, s, olo, ohi, dblo, dbhi in checks %}
                    {% set v = states(s) | float(default=none) %}
                    {% set lo = olo if olo is not none else state_attr(s, 'target_min') | float(default=none) %}
                    {% set hi = ohi if ohi is not none else state_attr(s, 'target_max') | float(default=none) %}
                    {% if v is not none and lo is not none and hi is not none %}
                      {% if (dblo is not none and v < lo - dblo) or (dbhi is not none and v > hi + dbhi) %}
                        {% if ns.worst < 2 %}{% set ns.worst = 2 %}{% endif %}
                      {% elif v < lo or v > hi %}
                        {% if ns.worst < 1 %}{% set ns.worst = 1 %}{% endif %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}

                  {% if ns.worst == 2 %}red{% elif ns.worst == 1 %}orange{% else
                  %}green{% endif %}
                content: >-
                  {% set c = states('sensor.backyard_cya') | float(default=none)
                  %}

                  {% set c = [[c, 20] | max, 100] | min if c is not none else 60
                  %}

                  {% set fcmin = [2, (0.05 * c) | round(0, 'floor')] | max %}

                  {% set fclo = [3, (0.075 * c) | round(0, 'floor')] | max %}

                  {% set fchi = c / 10 + 3 %}

                  {% set checks = [
                    ('pH', 'sensor.backyard_ph', none, none, 0.2, 0.2),
                    ('FC', 'sensor.backyard_fc', fclo, fchi, fclo - fcmin, none),
                    ('CC', 'sensor.backyard_cc', none, none, 0, 0),
                    ('TA', 'sensor.backyard_ta', none, none, 10, 10),
                    ('CH', 'sensor.backyard_ch', none, none, 100, 100),
                    ('CYA', 'sensor.backyard_cya', 60, 90, 10, 10),
                    ('CSI', 'sensor.backyard_csi', none, none, 0.3, 0.3)
                  ] %}

                  {% set ns = namespace(bad=[], warn=[]) %}

                  {% for name, s, olo, ohi, dblo, dbhi in checks %}
                    {% set v = states(s) | float(default=none) %}
                    {% set lo = olo if olo is not none else state_attr(s, 'target_min') | float(default=none) %}
                    {% set hi = ohi if ohi is not none else state_attr(s, 'target_max') | float(default=none) %}
                    {% if v is not none and lo is not none and hi is not none %}
                      {% if (dblo is not none and v < lo - dblo) or (dbhi is not none and v > hi + dbhi) %}
                        {% set ns.bad = ns.bad + [name] %}
                      {% elif v < lo or v > hi %}
                        {% set ns.warn = ns.warn + [name] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}

                  {% if ns.bad | length > 0 %}Danger {{ ns.bad | join(', ') }}

                  {% elif ns.warn | length > 0 %}Watch {{ ns.warn | join(', ')
                  }}

                  {% else %}Balanced{% endif %}
                tap_action:
                  action: none
              - type: template
                entity: sensor.backyard_ph
                icon: mdi:test-tube
                icon_color: >-
                  {% set tests = [
                    ('sensor.backyard_ph', 1),
                    ('sensor.backyard_fc', 1),
                    ('sensor.backyard_cc', 7),
                    ('sensor.backyard_ta', 7),
                    ('sensor.backyard_ch', 30),
                    ('sensor.backyard_cya', 30)
                  ] %} {% set ns = namespace(worst=0) %} {% for s, interval in
                  tests %}
                    {% set ts = state_attr(s, 'last_updated') %}
                    {% if ts %}
                      {% set age_d = (as_timestamp(now()) - as_timestamp(ts)) / 86400 %}
                      {% if age_d > interval * 2 %}
                        {% if ns.worst < 2 %}{% set ns.worst = 2 %}{% endif %}
                      {% elif age_d > interval %}
                        {% if ns.worst < 1 %}{% set ns.worst = 1 %}{% endif %}
                      {% endif %}
                    {% else %}
                      {% if ns.worst < 2 %}{% set ns.worst = 2 %}{% endif %}
                    {% endif %}
                  {% endfor %} {% if ns.worst == 2 %}red{% elif ns.worst == 1
                  %}orange{% else %}green{% endif %}
                content: >-
                  {% set tests = [
                    ('sensor.backyard_ph', 'pH', 1),
                    ('sensor.backyard_fc', 'FC', 1),
                    ('sensor.backyard_cc', 'CC', 7),
                    ('sensor.backyard_ta', 'TA', 7),
                    ('sensor.backyard_ch', 'CH', 30),
                    ('sensor.backyard_cya', 'CYA', 30)
                  ] %} {% set ns = namespace(overdue=[], due=[]) %} {% for s,
                  name, interval in tests %}
                    {% set ts = state_attr(s, 'last_updated') %}
                    {% if ts %}
                      {% set age_d = (as_timestamp(now()) - as_timestamp(ts)) / 86400 %}
                      {% if age_d > interval * 2 %}
                        {% set ns.overdue = ns.overdue + [name] %}
                      {% elif age_d > interval %}
                        {% set ns.due = ns.due + [name] %}
                      {% endif %}
                    {% else %}
                      {% set ns.overdue = ns.overdue + [name] %}
                    {% endif %}
                  {% endfor %} {% if ns.overdue | length > 0 and ns.due | length
                  > 0 %}Test {{ ns.overdue | join(', ') }} · Due {{ ns.due |
                  join(', ') }} {% elif ns.overdue | length > 0 %}Test {{
                  ns.overdue | join(', ') }} {% elif ns.due | length > 0 %}Due
                  {{ ns.due | join(', ') }} {% else %}Tests current{% endif %}
                tap_action:
                  action: none
              - type: template
                entity: sensor.pool_controller_outdoor_temperature
                icon: mdi:thermometer
                icon_color: >-
                  {% set t =
                  states('sensor.pool_controller_outdoor_temperature') |
                  float(default=none) %}

                  {% if t is none %}disabled

                  {% elif t < 60 %}blue

                  {% elif t <= 85 %}green

                  {% elif t <= 95 %}orange

                  {% else %}red{% endif %}
                content: >-
                  {% set t =
                  states('sensor.pool_controller_outdoor_temperature') |
                  float(default=none) %} Air {{ (t | round(0) | int) ~ '°F' if t
                  is not none else '—' }}
                tap_action:
                  action: none
              - type: template
                entity: sensor.pool_controller_surface_water_temperature
                icon: mdi:pool
                icon_color: >-
                  {% set t =
                  states('sensor.pool_controller_surface_water_temperature') |
                  float(default=none) %}

                  {% if t is none %}disabled

                  {% elif t < 78 %}blue

                  {% elif t < 82 %}orange

                  {% elif t <= 86 %}green

                  {% elif t <= 90 %}orange

                  {% else %}red{% endif %}
                content: >-
                  {% set t =
                  states('sensor.pool_controller_surface_water_temperature') |
                  float(default=none) %} Surface {{ (t | round(0) | int) ~ '°F'
                  if t is not none else '—' }}
                tap_action:
                  action: none
              - type: template
                entity: sensor.home_lightning_distance
                icon: mdi:lightning-bolt
                icon_color: >-
                  {% set dist = states('sensor.home_lightning_distance') |
                  float(default=999) %}

                  {% set count = states('sensor.home_lightning_counter') |
                  int(default=0) %}

                  {% if count > 0 and dist < 6 %}
                    {% set elapsed = (as_timestamp(now()) - as_timestamp(states.sensor.home_lightning_distance.last_changed)) / 60 %}
                    {% if elapsed < 30 %}red{% else %}green{% endif %}
                  {% else %}green{% endif %}
                content: >-
                  {% set dist = states('sensor.home_lightning_distance') |
                  float(default=999) %}

                  {% set count = states('sensor.home_lightning_counter') |
                  int(default=0) %}

                  {% if count > 0 and dist < 6 %}
                    {% set elapsed = (as_timestamp(now()) - as_timestamp(states.sensor.home_lightning_distance.last_changed)) / 60 %}
                    {% set remaining = (30 - elapsed) | round(0) | int %}
                    {% if remaining > 0 %}Unsafe {{ remaining }}m{% else %}Clear{% endif %}
                  {% else %}Clear{% endif %}
                tap_action:
                  action: none
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Auto
                icon: mdi:autorenew
                layout: vertical
                fill_container: true
                icon_color: >-
                  {% if states('sensor.pool_controller_pool_mode') in ['Auto',
                  'Cleaning'] %}green{% else %}disabled{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_auto
              - type: custom:mushroom-template-card
                primary: Spillover
                icon: mdi:waterfall
                layout: vertical
                fill_container: true
                icon_color: >-
                  {% if is_state('sensor.pool_controller_pool_mode',
                  'Spillover') %}purple{% else %}disabled{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_spillover
              - type: custom:mushroom-template-card
                primary: Ftn Low
                icon: mdi:fountain
                layout: vertical
                fill_container: true
                icon_color: >-
                  {% if is_state('sensor.pool_controller_pool_mode', 'Fountains
                  Low') %}cyan{% else %}disabled{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_fountains_low
              - type: custom:mushroom-template-card
                primary: Ftn High
                icon: mdi:fountain
                layout: vertical
                fill_container: true
                icon_color: >-
                  {% if is_state('sensor.pool_controller_pool_mode', 'Fountains
                  High') %}teal{% else %}disabled{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_fountains_high
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Pool
                icon: mdi:pool
                layout: vertical
                fill_container: true
                icon_color: >-
                  {% if is_state('sensor.pool_controller_pool_mode', 'Pool')
                  %}blue{% else %}disabled{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_pool
              - type: custom:mushroom-template-card
                primary: Spa
                icon: mdi:hot-tub
                layout: vertical
                fill_container: true
                icon_color: >-
                  {% if is_state('sensor.pool_controller_pool_mode', 'Spa')
                  %}orange{% else %}disabled{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_spa
              - type: custom:mushroom-template-card
                primary: Bubbles
                icon: mdi:chart-bubble
                layout: vertical
                fill_container: true
                icon_color: >-
                  {% if is_state('sensor.pool_controller_pool_mode', 'Spa
                  Bubbles') %}amber{% else %}disabled{% endif %}
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_spa_bubbles
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:vertical-stack-in-card
                horizontal: true
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.pool_controller_pump_rpm
                    icon: mdi:pump
                    layout: vertical
                    fill_container: true
                    primary: >-
                      {{ states('sensor.pool_controller_pump_rpm') | int(0) }}
                      rpm
                    secondary: >-
                      {{ states('sensor.pool_controller_pump_flow') | int(0) }}
                      gpm · {{ states('sensor.pool_controller_pump_power') |
                      int(0) }} W
                    icon_color: >-
                      {% if is_state('binary_sensor.pool_controller_pump_alarm',
                      'on') or
                      is_state('binary_sensor.pool_controller_pump_comms_lost',
                      'on') %}red {% elif
                      is_state('binary_sensor.pool_controller_pump_running',
                      'on') %}green {% else %}disabled{% endif %}
                    badge_color: red
                    badge_icon: >-
                      {{ 'mdi:alert' if
                      is_state('binary_sensor.pool_controller_pump_alarm', 'on')
                      or
                      is_state('binary_sensor.pool_controller_pump_comms_lost',
                      'on') else '' }}
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: number.pool_controller_chlorine_output
                    icon: mdi:water-percent
                    layout: vertical
                    fill_container: true
                    primary: >-
                      {{ states('number.pool_controller_chlorine_output') |
                      int(0) }}%
                    secondary: >-
                      {{ states('sensor.pool_controller_salt_level') | int(0) }}
                      ppm
                    icon_color: >-
                      {% if
                      is_state('binary_sensor.pool_controller_chlorinator_comms_lost',
                      'on') or is_state('binary_sensor.pool_controller_no_flow',
                      'on') or
                      is_state('binary_sensor.pool_controller_low_salt', 'on')
                      or is_state('binary_sensor.pool_controller_very_low_salt',
                      'on') or
                      is_state('binary_sensor.pool_controller_inspect_cell',
                      'on') or
                      is_state('binary_sensor.pool_controller_cell_water_too_cold',
                      'on') %}red{% else %}blue{% endif %}
                    badge_color: red
                    badge_icon: >-
                      {{ 'mdi:alert' if
                      is_state('binary_sensor.pool_controller_chlorinator_comms_lost',
                      'on') or is_state('binary_sensor.pool_controller_no_flow',
                      'on') or
                      is_state('binary_sensor.pool_controller_low_salt', 'on')
                      or is_state('binary_sensor.pool_controller_very_low_salt',
                      'on') or
                      is_state('binary_sensor.pool_controller_inspect_cell',
                      'on') or
                      is_state('binary_sensor.pool_controller_cell_water_too_cold',
                      'on') else '' }}
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: sensor.pool_controller_filter_dirtiness
                    icon: mdi:air-filter
                    layout: vertical
                    fill_container: true
                    primary: >-
                      {% set v =
                      states('sensor.pool_controller_filter_dirtiness') %} {{
                      ((v | float | round(0) | int) ~ '%') if v not in
                      ['unknown','unavailable','none',''] else '—' }}
                    secondary: >-
                      {{ 'Baseline pending' if
                      is_state('binary_sensor.pool_controller_filter_baseline_pending',
                      'on') else 'Filter dirt' }}
                    icon_color: >-
                      {% if
                      is_state('binary_sensor.pool_controller_clean_filter_needed',
                      'on') %}orange {% else %}green{% endif %}
                    badge_color: orange
                    badge_icon: >-
                      {{ 'mdi:alert' if
                      is_state('binary_sensor.pool_controller_clean_filter_needed',
                      'on') else '' }}
                    tap_action:
                      action: more-info
              - type: custom:vertical-stack-in-card
                horizontal: true
                cards:
                  - type: custom:mushroom-template-card
                    icon: mdi:valve
                    layout: vertical
                    fill_container: true
                    primary: >-
                      {% set spa =
                      states('switch.pool_controller_spa_suction_valve') %} {%
                      set drain =
                      states('switch.pool_controller_main_drain_suction_valve')
                      %} {% if spa in ['unknown','unavailable'] or drain in
                      ['unknown','unavailable'] %}— {%- elif spa == 'on' %}Spa
                      {%- elif drain == 'on' %}Main Drain {%- else %}Skimmers{%
                      endif %}
                    secondary: Suction
                    icon_color: teal
                  - type: custom:mushroom-template-card
                    icon: mdi:valve
                    layout: vertical
                    fill_container: true
                    primary: >-
                      {% set spa =
                      states('switch.pool_controller_spa_return_valve') %} {%
                      set ftn =
                      states('switch.pool_controller_fountain_return_valve') %}
                      {% if spa in ['unknown','unavailable'] or ftn in
                      ['unknown','unavailable'] %}— {%- elif spa == 'on' %}Spa
                      {%- elif ftn == 'on' %}Fountains {%- else %}Pool Jets{%
                      endif %}
                    secondary: Return
                    icon_color: cyan
                  - type: custom:mushroom-template-card
                    entity: switch.pool_controller_booster_pump_relay
                    icon: mdi:pump
                    layout: vertical
                    fill_container: true
                    primary: Booster
                    secondary: >-
                      {{ 'On' if
                      is_state('switch.pool_controller_booster_pump_relay',
                      'on') else 'Off' }}
                    icon_color: >-
                      {{ 'blue' if
                      is_state('switch.pool_controller_booster_pump_relay',
                      'on') else 'disabled' }}
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: switch.pool_controller_blower_relay
                    icon: mdi:weather-windy
                    layout: vertical
                    fill_container: true
                    primary: Blower
                    secondary: >-
                      {{ 'On' if is_state('switch.pool_controller_blower_relay',
                      'on') else 'Off' }}
                    icon_color: >-
                      {{ 'blue' if
                      is_state('switch.pool_controller_blower_relay', 'on') else
                      'disabled' }}
                    tap_action:
                      action: more-info
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:broom
                content: Run Clean
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.pool_controller_run_cleaning_cycle
              - type: template
                entity: switch.pool_controller_service_mode
                icon: mdi:account-wrench
                content: Service
                icon_color: >-
                  {{ 'red' if is_state('switch.pool_controller_service_mode',
                  'on') else 'disabled' }}
                tap_action:
                  action: toggle
          - type: conditional
            conditions:
              - entity: switch.pool_controller_service_mode
                state: 'on'
            card:
              type: entities
              title: Manual Relays
              show_header_toggle: false
              state_color: true
              entities:
                - entity: switch.pool_controller_pump_relay
                  name: Pump
                - entity: switch.pool_controller_booster_pump_relay
                  name: Cleaner (Booster)
                - entity: switch.pool_controller_blower_relay
                  name: Blower
                - type: section
                  label: Valve Actuators
                - entity: switch.pool_controller_valve_actuator_power
                  name: Actuator Power
                - entity: switch.pool_controller_spa_suction_valve
                  name: Spa Suction
                - entity: switch.pool_controller_main_drain_suction_valve
                  name: Main Drain Suction
                - entity: switch.pool_controller_spa_return_valve
                  name: Spa Return
                - entity: switch.pool_controller_fountain_return_valve
                  name: Fountain Return
                - type: section
                  label: Pump
                - entity: number.pool_controller_pump_flow_setpoint
                  name: Flow Setpoint
                - entity: number.pool_controller_pump_rpm_setpoint
                  name: RPM Setpoint
                - entity: button.pool_controller_backwash_or_rinse
                  name: Backwash / Rinse
                - entity: button.pool_controller_pump_stop
                  name: Pump Stop
                - entity: button.pool_controller_mark_filter_clean
                  name: Mark Filter Clean
                - type: section
                  label: Chlorinator
                - entity: number.pool_controller_chlorine_output
                  name: Chlorine Output
          - type: custom:blitzortung-lightning-card
            distance_entity: sensor.home_lightning_distance
            counter_entity: sensor.home_lightning_counter
            azimuth_entity: sensor.home_lightning_azimuth
            always_show_full_card: true
            lightning_detection_radius: 12
            show_radar: true
            show_map: true
            period: 1h
            show_history_chart: true
            grid_color: var(--primary-text-color)
            strike_color: var(--error-color)
            title: Lightning (<6 mi, <30 mins clear pool)
            card_section_order:
              - compass_radar
              - history_chart
              - map
      - type: grid
        cards:
          - type: custom:card-templater
            entities:
              - sensor.pool_controller_surface_water_temperature
            card:
              type: custom:apexcharts-card
              header:
                show: true
                title: Surface Temperature
                show_states: true
                floating: true
                colorize_states: true
              experimental:
                color_threshold: true
              yaxis:
                - min: 35
                  max: 95
                  show: false
              apex_config:
                chart:
                  height: 120
                  sparkline:
                    enabled: true
                xaxis:
                  labels:
                    show: false
                  axisTicks:
                    show: false
                  axisBorder:
                    show: false
                grid:
                  show: false
                annotations:
                  yaxis:
                    - 'y': 82
                      y2: 86
                      fillColor: '#2ecc7140'
                      borderColor: '#00000000'
                      strokeDashArray: 0
                    - 'y': 78
                      y2: 82
                      fillColor: '#e67e2230'
                      borderColor: '#00000000'
                      strokeDashArray: 0
                    - 'y': 86
                      y2: 90
                      fillColor: '#e67e2230'
                      borderColor: '#00000000'
                      strokeDashArray: 0
                    - 'y': 35
                      y2: 78
                      fillColor: '#3498db20'
                      borderColor: '#00000000'
                      strokeDashArray: 0
                    - 'y': 90
                      y2: 95
                      fillColor: '#e74c3c20'
                      borderColor: '#00000000'
                      strokeDashArray: 0
                legend:
                  show: false
              all_series_config:
                stroke_width: 2
                type: line
                show:
                  legend_value: false
                  header_color_threshold: true
                  name_in_header: false
                  in_header: raw
                statistics:
                  type: mean
                  period: hour
              series:
                - entity: sensor.pool_controller_surface_water_temperature
                  name: Surface
                  color_threshold:
                    - value: 30
                      color: '#3498db'
                    - value: 77.99
                      color: '#3498db'
                    - value: 78
                      color: '#e67e22'
                    - value: 81.99
                      color: '#e67e22'
                    - value: 82
                      color: '#2ecc71'
                    - value: 85.99
                      color: '#2ecc71'
                    - value: 86
                      color: '#e67e22'
                    - value: 89.99
                      color: '#e67e22'
                    - value: 90
                      color: '#e74c3c'
              graph_span: 30d
              span:
                end: day
          - type: custom:card-templater
            entities:
              - sensor.backyard_ph
            card:
              type: custom:apexcharts-card
              header:
                show: true
