                      {"y": {{ tgt }}, "borderColor": "#ffffff80", "strokeDashArray": 4}{% endif %}
                    ]
                legend:
                  show: false
              all_series_config:
                stroke_width: 2
                type: line
                show:
                  legend_value: false
                  header_color_threshold: true
                  in_header: raw
                statistics:
                  type: mean
                  period: hour
              series:
                - entity: sensor.backyard_csi
                  name_template: >-
                    {% set ts = state_attr('sensor.backyard_csi',
                    'last_updated') %}{% if ts %}{% set age_h =
                    ((as_timestamp(now()) - as_timestamp(ts)) / 3600) %}{% if
                    age_h >= 48 %}{{ (age_h / 24) | round(0) | int }}d ago{%
                    elif age_h >= 1 %}{{ age_h | round(0) | int }}h ago{% else
                    %}{{ (age_h * 60) | round(0) | int }}m ago{% endif %}{% else
                    %}—{% endif %}
                  color_threshold_template: >-
                    {% set tmin = state_attr('sensor.backyard_csi',
                    'target_min') | float(-0.3) %}

                    {% set tmax = state_attr('sensor.backyard_csi',
                    'target_max') | float(0.3) %}

                    [
                      {"value": -0.9, "color": "#e74c3c"},
                      {"value": {{ tmin - 0.3 - 0.01 }}, "color": "#e74c3c"},
                      {"value": {{ tmin - 0.3 }}, "color": "#f1c40f"},
                      {"value": {{ tmin - 0.01 }}, "color": "#f1c40f"},
                      {"value": {{ tmin }}, "color": "#2ecc71"},
                      {"value": {{ tmax }}, "color": "#2ecc71"},
                      {"value": {{ tmax + 0.01 }}, "color": "#f1c40f"},
                      {"value": {{ tmax + 0.3 }}, "color": "#f1c40f"},
                      {"value": {{ tmax + 0.3 + 0.01 }}, "color": "#e74c3c"}
                    ]
              graph_span: 30d
              span:
                end: day
      - type: grid
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Temperature (current)
            experimental:
              color_threshold: true
            yaxis:
              - min: '|-0|'
                max: '|+0|'
            all_series_config:
              stroke_width: 2
              type: line
              show:
                legend_value: false
            series:
              - entity: sensor.pool_controller_outdoor_temperature
                name: Air
              - entity: sensor.pool_controller_spa_water_temperature
                name: Spa
              - entity: sensor.pool_controller_surface_water_temperature
                name: Surface
              - entity: sensor.pool_controller_deep_water_temperature
                name: Deep
            graph_span: 1d
            span:
              end: minute
          - type: custom:apexcharts-card
            header:
              show: true
              title: 7d Temperature
            yaxis:
              - min: '|-0|'
                max: '|+0|'
            all_series_config:
              stroke_width: 2
              type: line
              show:
                legend_value: false
                header_color_threshold: true
                name_in_header: false
              statistics:
                type: mean
                period: hour
            series:
              - entity: sensor.pool_controller_outdoor_temperature
                name: Air
              - entity: sensor.pool_controller_spa_water_temperature
                name: Spa
              - entity: sensor.pool_controller_surface_water_temperature
                name: Surface
              - entity: sensor.pool_controller_deep_water_temperature
                name: Deep
            graph_span: 7d
            span:
              end: day
          - type: custom:apexcharts-card
            header:
              show: true
              title: 30d Temperature
            yaxis:
              - min: '|-0|'
                max: '|+0|'
            all_series_config:
              stroke_width: 2
              type: line
              show:
                legend_value: false
                header_color_threshold: true
                name_in_header: false
              statistics:
                type: mean
                period: hour
            series:
              - entity: sensor.pool_controller_outdoor_temperature
                name: Air
              - entity: sensor.pool_controller_spa_water_temperature
                name: Spa
              - entity: sensor.pool_controller_surface_water_temperature
                name: Surface
              - entity: sensor.pool_controller_deep_water_temperature
                name: Deep
            graph_span: 30d
            span:
              end: day
    cards: []
